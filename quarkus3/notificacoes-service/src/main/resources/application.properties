quarkus.application.name=notificacoes-service-q3
quarkus.http.host=0.0.0.0
quarkus.http.port=8086

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${NOTIFICACOES_DB_URL:jdbc:postgresql://localhost:55432/notificacoes_q3}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

mp.messaging.incoming.usuario-criado.connector=smallrye-rabbitmq
mp.messaging.incoming.usuario-criado.exchange.name=notificacoes.q3
mp.messaging.incoming.usuario-criado.exchange.type=topic
mp.messaging.incoming.usuario-criado.routing-keys=usuario.criado
mp.messaging.incoming.usuario-criado.queue.name=notificacao.usuario.criado.q3
mp.messaging.incoming.usuario-criado.queue.durable=true
mp.messaging.incoming.usuario-criado.auto-acknowledgement=false
mp.messaging.incoming.usuario-criado.failure-strategy=reject
mp.messaging.incoming.usuario-criado.auto-bind-dlq=true
mp.messaging.incoming.usuario-criado.dlx.declare=true
mp.messaging.incoming.usuario-criado.dead-letter-queue-name=notificacao.usuario.criado.q3.dlq
mp.messaging.incoming.usuario-criado.host=${RABBITMQ_HOST:localhost}
mp.messaging.incoming.usuario-criado.port=${RABBITMQ_PORT:55672}
mp.messaging.incoming.usuario-criado.username=${RABBITMQ_USER:guest}
mp.messaging.incoming.usuario-criado.password=${RABBITMQ_PASS:guest}

notificacao.simular-delay-ms=1200
notificacao.falha-keyword=falha

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] %s%e%n
