quarkus.application.name=usuarios-service-q2
quarkus.http.host=0.0.0.0
quarkus.http.port=8081

# Angular (4200) e Flutter web (4201)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# Banco exclusivo deste servico/versao
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${USUARIOS_DB_URL:jdbc:postgresql://localhost:55432/usuarios_q2}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Evento publicado no broker (Q2 usa o conector smallrye-rabbitmq da SmallRye RM 3.x)
mp.messaging.outgoing.usuario-criado.connector=smallrye-rabbitmq
mp.messaging.outgoing.usuario-criado.exchange.name=notificacoes.q2
mp.messaging.outgoing.usuario-criado.exchange.type=topic
mp.messaging.outgoing.usuario-criado.exchange.durable=true
mp.messaging.outgoing.usuario-criado.default-routing-key=usuario.criado
mp.messaging.outgoing.usuario-criado.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.usuario-criado.port=${RABBITMQ_PORT:55672}
mp.messaging.outgoing.usuario-criado.username=${RABBITMQ_USER:guest}
mp.messaging.outgoing.usuario-criado.password=${RABBITMQ_PASS:guest}

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] %s%e%n
